<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Carmen Lopez - 1890-22-3067</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        .carousel-item img {
            height: 400px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <div class="container-fluid bg-light p-3 d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">Mi Tienda Online Carmencita</h1>
            <div class="cart-icon position-relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                    <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                </svg>
                <span id="contador-carrito" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle">0</span>
            </div>
        </div>

        <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/1200/400?random=1" class="d-block w-100" alt="Slide 1">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/400?random=2" class="d-block w-100" alt="Slide 2">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/400?random=3" class="d-block w-100" alt="Slide 3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </header>

    <main class="container my-4">
        <div class="row">
            <div class="col-12 col-sm-3 mb-3">
                <div class="card">
                    <div class="card-header">
                        Categorías
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Categoría 1</a></li>
                        <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Categoría 2</a></li>
                        <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Categoría 3</a></li>
                        <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Categoría 4</a></li>
                        <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Categoría 5</a></li>
                    </ul>
                </div>
            </div>

            <div class="col-12 col-sm-9">
                <div id="contenedor-productos" class="row">
                    </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <div class="container">
            <p class="mb-0">Diseñado por: Carmen Lopez - 1890-22-3067</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eGtY3Q" crossorigin="anonymous"></script>

    <script>
        const url = "https://backcvbgtmdesa.azurewebsites.net/api/productos";
        const contenedor = document.getElementById("contenedor-productos");
        const contadorCarrito = document.getElementById("contador-carrito");
        let carrito = 0;

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(productos => {
                productos.forEach(producto => {
                    const col = document.createElement("div");
                    col.className = "col-12 col-md-4 mb-4";

                    let precioHTML = "";
                    if (producto.EnOferta && producto.PrecioOferta != null) {
                        precioHTML = `
                            <span class="text-danger fw-bold">$${parseFloat(producto.PrecioOferta).toFixed(2)}</span>
                            <small class="text-muted text-decoration-line-through ms-2">$${parseFloat(producto.Precio).toFixed(2)}</small>
                        `;
                    } else {
                        precioHTML = `<span class="fw-bold">$${parseFloat(producto.Precio).toFixed(2)}</span>`;
                    }

                    col.innerHTML = `
                        <div class="card h-100">
                            <img src="${producto.Imagen}" class="card-img-top" alt="${producto.Nombre}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${producto.Nombre}</h5>
                                <p class="card-text">${producto.Descripcion}</p>
                                <p>${precioHTML}</p>
                                <a href="#" class="btn btn-primary mt-auto agregarCarrito">Agregar al carrito</a>
                            </div>
                        </div>
                    `;

                    col.querySelector(".agregarCarrito").addEventListener("click", (e) => {
                        e.preventDefault();
                        carrito++;
                        contadorCarrito.textContent = carrito;
                    });

                    contenedor.appendChild(col);
                });
            })
            .catch(error => {
                console.error("Error al cargar productos:", error);
                contenedor.innerHTML = '<div class="alert alert-danger">No se pudieron cargar los productos. Por favor, intente de nuevo más tarde.</div>';
            });
    </script>
</body>
</html>
